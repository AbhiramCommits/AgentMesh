name: agentmesh

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
      POSTGRES_DB: agentmesh
    ports:
      # Host 5433 avoids clashing with any pre-existing local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      # Host 6380 avoids clashing with any pre-existing local Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://agentmesh:agentmesh@postgres:5432/agentmesh
      REDIS_URL: redis://redis:6379/0
      AGENTMESH_PROVIDER: fake
      AGENTMESH_API_HOST: 0.0.0.0
      AGENTMESH_API_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/seed_docs.py &&
             uvicorn agentmesh.api.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
